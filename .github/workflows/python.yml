name: Python SDK

on:
  push:
    paths: ["python/**", "conformance/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "conformance/**", ".github/workflows/python.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: conformance (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s python/tests -v
      - name: API manifest check
        run: python conformance/runners/python/check_api.py
      - name: Conformance suite (every case, every step)
        run: python conformance/driver.py --runner "python conformance/runners/python/runner.py" --all-steps --report conformance-report.json
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-python-${{ matrix.os }}-${{ matrix.python }}
          path: conformance-report.json
          if-no-files-found: ignore

  wheel:
    name: wheel and clean install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build python --outdir dist
          ls dist
          test -f dist/opentideconstants-*-py3-none-any.whl
      - name: Install the wheel in a clean python:3.10-slim container and run the quickstart against the fixture server
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD:/repo:ro" python:3.10-slim sh -c '
            set -e
            pip install --no-index --quiet /dist/opentideconstants-*-py3-none-any.whl
            cd /tmp
            python /repo/conformance/server.py --port 8765 --proxy-port 8766 >/tmp/server.log 2>&1 &
            sleep 2
            OPENTIDECONSTANTS_BASE_URL=http://127.0.0.1:8765/good/ python /repo/python/examples/quickstart.py
            python /repo/conformance/runners/python/check_api.py --installed
            python /repo/conformance/driver.py --runner "python /repo/conformance/runners/python/runner.py --installed"'
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist
