name: Python SDK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every run step uses bash, on Windows too. The default Windows shell (pwsh)
# exits with the status of the last command only, so a failing command
# earlier in a step is lost. GitHub runs `shell: bash` as bash -eo pipefail.
defaults:
  run:
    shell: bash

# A newer push to the same branch or pull request cancels the older run;
# every run on main finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.paths.outputs.python }}
      swift: ${{ steps.paths.outputs.swift }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: paths
        run: ruby .github/ci_paths.rb

  conformance:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: conformance (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional zone data for platform parity, and pytest for the canonical shape tests
        run: python -m pip install -e 'python[tz]' pytest
      - name: Unit tests
        run: python -m unittest discover -s python/tests -v
      - name: Canonical shape tests (pytest)
        run: python -m pytest -q -p no:cacheprovider python/tests/test_canonical_shape.py
      - name: API manifest check
        run: python conformance/runners/python/check_api.py
      - name: Conformance suite (every case, every step)
        run: python conformance/driver.py --runner "python conformance/runners/python/runner.py" --all-steps --report conformance-report.json
      - name: Pinned real-data prediction vectors
        run: python conformance/tools/run_vectors.py --runner "python conformance/runners/python/runner.py" --no-expected-failures --report vectors-report.json
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-python-${{ matrix.os }}-${{ matrix.python }}
          path: |
            conformance-report.json
            vectors-report.json
          if-no-files-found: error

  wheel:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: wheel and clean install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build python --outdir dist
          ls dist
          test -f dist/opentideconstants-*-py3-none-any.whl
      # The same bytes as python/supported-formats.json, not only the name (R2-245)
      - name: The wheel and the sdist carry supported-formats.json (spec 7.4)
        run: |
          mkdir -p dist-check/wheel dist-check/sdist
          python -m zipfile -e dist/opentideconstants-*-py3-none-any.whl dist-check/wheel
          cmp python/supported-formats.json dist-check/wheel/opentideconstants/supported-formats.json
          tar -xzf dist/opentideconstants-*.tar.gz -C dist-check/sdist
          cmp python/supported-formats.json dist-check/sdist/opentideconstants-*/supported-formats.json
      # As the runner's own user, not root: as root the chmod-based unit tests and
      # the read-only cache cases cannot see a permission error, so they fail (R2-359).
      - name: Install the wheel in a clean python:3.10-slim container, run the unit tests on it, and run the quickstart against the fixture server
        run: |
          docker run --rm -i --user "$(id -u):$(id -g)" -e HOME=/tmp/home -v "$PWD/dist:/dist:ro" -v "$PWD:/repo:ro" python:3.10-slim bash -eo pipefail -s <<'SCRIPT'
          test "$(id -u)" -ne 0
          mkdir -p "$HOME"
          # a venv, not pip --user: the driver gives each runner its own HOME
          python -m venv /tmp/venv
          export PATH=/tmp/venv/bin:$PATH
          pip install --no-index --quiet /dist/opentideconstants-*-py3-none-any.whl
          pip install --quiet pytest
          cd /tmp
          OTC_TEST_INSTALLED=1 PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s /repo/python/tests -v
          python /repo/conformance/server.py --port 8765 --proxy-port 8766 >/tmp/server.log 2>&1 &
          server=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "--- fixture server log"; cat /tmp/server.log; fi' EXIT
          # Wait until the server accepts connections on both ports (at most 30 s).
          for _ in $(seq 1 150); do
            if python -c 'import socket; [socket.create_connection(("127.0.0.1", p), 1).close() for p in (8765, 8766)]' 2>/dev/null; then
              break
            fi
            kill -0 "$server" 2>/dev/null || { echo "the fixture server exited before it was ready"; exit 1; }
            sleep 0.2
          done
          python -c 'import socket; [socket.create_connection(("127.0.0.1", p), 1).close() for p in (8765, 8766)]' || { echo "the fixture server is not ready after 30 s"; exit 1; }
          expect() { grep -qxF "$2" "$1" || { echo "quickstart output lacks the line: $2"; exit 1; }; }
          export OPENTIDECONSTANTS_BASE_URL=http://127.0.0.1:8765/good/
          python /repo/python/examples/quickstart.py | tee /tmp/online.txt
          expect /tmp/online.txt "release 20991231.2 format 1.0 from download"
          expect /tmp/online.txt "station OTC-T-0001 San Francisco 37.8063 -122.4659"
          expect /tmp/online.txt "M2 0.5 m 101.25 deg"
          OPENTIDECONSTANTS_OFFLINE=1 python /repo/python/examples/quickstart.py | tee /tmp/offline.txt
          expect /tmp/offline.txt "release 20991231.2 format 1.0 from cache"
          expect /tmp/offline.txt "M2 0.5 m 101.25 deg"
          unset OPENTIDECONSTANTS_BASE_URL
          python /repo/conformance/runners/python/check_api.py --installed
          python /repo/conformance/driver.py --runner "python /repo/conformance/runners/python/runner.py --installed"
          SCRIPT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: dist
          if-no-files-found: error

  no-tz:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: prediction without a timezone database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the SDK without optional zone data
        run: |
          python -m venv /tmp/otc-no-tz
          /tmp/otc-no-tz/bin/pip install ./python
      - name: Native prediction and missing-zone refusal
        env:
          PYTHONTZPATH: ''
        run: |
          /tmp/otc-no-tz/bin/python conformance/driver.py --runner "/tmp/otc-no-tz/bin/python conformance/runners/python/runner.py --installed" --profile python-no-tz --only 'predict-|not-built' --all-steps --no-expected-failures
          /tmp/otc-no-tz/bin/python conformance/tools/run_vectors.py --runner "/tmp/otc-no-tz/bin/python conformance/runners/python/runner.py --installed" --no-expected-failures

  ci:
    name: Python CI
    if: always()
    needs: [changes, conformance, wheel, no-tz]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          ruby -rjson <<'RUBY'
          results = JSON.parse(ENV.fetch('RESULTS'))
          changes = results.fetch('changes')
          abort 'Changed-path detection failed' unless changes.fetch('result') == 'success'
          [["conformance", "relevant"], ["wheel", "relevant"], ["no-tz", "relevant"]].each do |job, output|
              relevant = changes.fetch('outputs').fetch(output)
              abort 'Missing path decision' unless %w[true false].include?(relevant)
              expected = relevant == 'true' ? 'success' : 'skipped'
              abort "Required job failed: #{job}" unless results.fetch(job).fetch('result') == expected
          end
          RUBY
