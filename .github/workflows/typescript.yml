name: TypeScript SDK

on:
  push:
    paths:
      - "js/**"
      - "conformance/**"
      - ".github/workflows/typescript.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "js/**"
      - "conformance/**"
      - ".github/workflows/typescript.yml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

# Every run step uses bash, on Windows too. The default Windows shell (pwsh)
# exits with the status of the last command only, so a failing command
# earlier in a step is lost. GitHub runs `shell: bash` as bash -eo pipefail.
defaults:
  run:
    shell: bash

# A newer push to the same branch or pull request cancels the older run;
# every run on main finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  node:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24"]
        include:
          - os: ubuntu-latest
            node: "22"
          # The floor in package.json engines and the README.
          - os: ubuntu-latest
            node: "22.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install dev dependencies
        working-directory: js
        run: npm ci
      - name: The embedded fold table is the suite's
        working-directory: js
        run: npm run gen:check
      - name: Build (tsc, strict)
        working-directory: js
        run: npm run build
      - name: API manifest check (dist/index.d.ts with the compiler API)
        working-directory: js
        run: npm run check:api
      - name: Unit tests
        working-directory: js
        run: npm run test:unit
      # --profile: a runner that says hello under another name, or loses a
      # feature, fails the run instead of skipping those cases (R2-247)
      - name: Conformance suite (Node)
        shell: bash
        run: uv run conformance/driver.py --runner "node conformance/runners/node/runner.mjs" --profile typescript --report ts-node-report.json
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ts-node-report-${{ matrix.os }}-${{ matrix.node }}
          path: ts-node-report.json
          if-no-files-found: error

  browser:
    name: headless Chromium (CORS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install dev dependencies and Chromium
        working-directory: js
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Conformance suite (profile typescript-browser)
        run: uv run conformance/driver.py --runner "node conformance/runners/node/browser-runner.mjs" --profile typescript-browser --report ts-browser-report.json
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ts-browser-report
          path: ts-browser-report.json
          if-no-files-found: error

  package:
    name: npm pack in ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22.12 is the floor in package.json engines; require() of the ESM
        # package without a flag starts there.
        image: ["node:22.12-slim", "node:24-slim"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Pack
        working-directory: js
        run: |
          npm ci
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"
          # spec 7.4: the tarball ships supported-formats.json, the same bytes (R2-246)
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP"/pkg/opentideconstants-*.tgz -C "$RUNNER_TEMP/unpacked" package/supported-formats.json
          cmp supported-formats.json "$RUNNER_TEMP/unpacked/package/supported-formats.json"
          cp examples/quickstart.mjs "$RUNNER_TEMP/pkg/"
          node -p 'require("./package.json").devDependencies.typescript' > "$RUNNER_TEMP/pkg/typescript-version"
      - name: Install the tarball in a clean container and run the quickstart against the fixture server
        run: |
          uv run conformance/server.py --host 127.0.0.1 --port 18765 --proxy-port 18766 >"$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "--- fixture server log"; cat "$RUNNER_TEMP/server.log"; fi' EXIT
          # Wait until the server answers (at most 60 s; uv may first fetch a Python).
          for _ in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:18765/ && curl -s -o /dev/null http://127.0.0.1:18766/; then break; fi
            kill -0 "$server" 2>/dev/null || { echo "the fixture server exited before it was ready"; exit 1; }
            sleep 0.5
          done
          curl -s -o /dev/null http://127.0.0.1:18765/ || { echo "the fixture server is not ready after 60 s"; exit 1; }
          docker run --rm -i --network host -v "$RUNNER_TEMP/pkg:/pkg:ro" "${{ matrix.image }}" bash -eo pipefail -s <<'SCRIPT'
          node --version
          mkdir /app && cd /app && npm init -y >/dev/null
          npm install --no-audit --no-fund /pkg/opentideconstants-*.tgz
          npm ls --all --omit=dev --parseable > deps.txt
          test "$(wc -l < deps.txt)" -eq 2
          cp /pkg/quickstart.mjs .
          OPENTIDECONSTANTS_BASE_URL=http://127.0.0.1:18765/good/ node quickstart.mjs 9900001 | tee out.txt
          grep -q "OTC-T-0001 San Francisco: M2 amplitude 0.5 m" out.txt
          OPENTIDECONSTANTS_OFFLINE=1 node quickstart.mjs 9900001 | tee offline.txt
          grep -q "(cache)" offline.txt
          node -e 'const { OpenTideConstants } = require("opentideconstants"); if (typeof OpenTideConstants.open !== "function") process.exit(1)'
          # The published types in a project with neither ESNext.Disposable nor
          # @types/node, and skipLibCheck off (R2-248)
          mkdir /types && cd /types && npm init -y >/dev/null && npm pkg set type=module
          npm install --no-audit --no-fund /pkg/opentideconstants-*.tgz "typescript@$(cat /pkg/typescript-version)" >/dev/null
          printf '%s\n' 'import { OpenTideConstants } from "opentideconstants";' \
            'export const open: typeof OpenTideConstants.open = OpenTideConstants.open;' > consumer.ts
          printf '%s\n' '{"compilerOptions": {"noEmit": true, "strict": true, "skipLibCheck": false, "target": "ES2022",' \
            '"lib": ["ES2022", "DOM"], "module": "nodenext", "moduleResolution": "nodenext", "types": []}, "files": ["consumer.ts"]}' > tsconfig.json
          npx tsc -p tsconfig.json
          SCRIPT
