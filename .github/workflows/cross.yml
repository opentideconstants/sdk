name: Cross-SDK cases

# Spec §5.4, §5.5, §6.2 (phase step S4): the four SDKs share one cache and one
# stream index. Every case in conformance/cross/ runs once for each ordered
# pair of SDKs (writer, reader), with the fixture server stopped for the
# offline reads.

on:
  push:
    paths:
      - "python/**"
      - "ruby/**"
      - "js/**"
      - "c/**"
      - "conformance/**"
      - ".github/workflows/cross.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "python/**"
      - "ruby/**"
      - "js/**"
      - "c/**"
      - "conformance/**"
      - ".github/workflows/cross.yml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

# Every run step uses bash, on Windows too. The default Windows shell (pwsh)
# exits with the status of the last command only, so a failing command
# earlier in a step is lost. GitHub runs `shell: bash` as bash -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  # The suite's own checks: the fold table generator, the fold rules, and the
  # driver and server self-tests (conformance/tests).
  suite:
    name: suite self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The fold table is a fresh generation (Unicode 16.0.0)
        run: uv run conformance/tools/gen_fold_table.py --check
      - name: The fold table gives the expected folded names
        run: uv run conformance/tools/test_name_fold.py
      - name: Driver and server self-tests
        run: uv run --python 3.12 --with "pytest>=8,<9" python -m pytest conformance/tests -v -p no:cacheprovider

  cross:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, c_runner: c/build/otc_runner }
          - { os: macos-14, c_runner: c/build/otc_runner }
          - { os: windows-2022, c_runner: c/build/Debug/otc_runner.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Build the TypeScript SDK
        working-directory: js
        run: npm ci && npm run build
      - name: libcurl (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - name: libcurl (Windows, vcpkg)
        if: runner.os == 'Windows'
        run: vcpkg install curl:x64-windows
      - name: Build the C library with otc_fetch
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            cmake -S c -B c/build -DOTC_WITH_FETCH=ON -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          else
            cmake -S c -B c/build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DOTC_WITH_FETCH=ON
          fi
          cmake --build c/build --config Debug --parallel
      - name: The case files are current
        run: |
          python conformance/tools/build_cases.py --check
          python conformance/driver.py --check-cases
      - name: The fixtures are current and valid (format 1.0 and its index schema)
        run: uv run conformance/tools/build_fixtures.py --check
      - name: supported-formats.json matches each SDK's SUPPORTED_FORMAT_VERSION
        run: python conformance/tools/check_supported_formats.py
      - name: Cross-SDK cases (Python, Ruby, TypeScript, C)
        shell: bash
        run: |
          python conformance/driver.py \
            --cross python="python conformance/runners/python/runner.py" \
            --cross ruby="ruby conformance/runners/ruby/runner.rb" \
            --cross typescript="node conformance/runners/node/runner.mjs" \
            --cross c="${{ matrix.c_runner }}" \
            --report cross-report.json
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-report-${{ matrix.os }}
          path: cross-report.json
