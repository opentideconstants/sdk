name: TEMPORARY Windows crashed-lock stress (remove before merge)

# Temporary: reproduces a crashed-lock recovery failure seen once each in the
# Python and Ruby Windows jobs. It runs each test 50 times and uploads the logs.
# It publishes nothing and is removed before the branch is final.
on:
  push:
    branches: [sdk-parity]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  stress:
    name: TEMPORARY Windows lock stress
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with: { ruby-version: "3.3" }
      - name: Install the Python SDK
        run: python -m pip install -e 'python[tz]'
      - name: Python two waiters, 50 runs
        run: |
          mkdir -p stress-logs
          failed=0
          for i in $(seq 1 50); do
            if ! python -m unittest discover -s python/tests -p test_unit.py -k test_two_waiters_on_a_crashed_lock_never_hold_it_together > "stress-logs/python-$i.log" 2>&1; then
              failed=$((failed + 1))
            fi
          done
          echo "python: $failed of 50 runs failed" | tee -a stress-logs/summary.txt
          grep -h "cannot remove" stress-logs/python-*.log | sort | uniq -c | head -20 || true
      - name: Ruby two waiters, 50 runs
        run: |
          failed=0
          for i in $(seq 1 50); do
            if ! ruby -Iruby/lib -Iruby/test ruby/test/test_cache_lock.rb -n test_two_waiters_on_a_crashed_lock_never_hold_it_together > "stress-logs/ruby-$i.log" 2>&1; then
              failed=$((failed + 1))
            fi
          done
          echo "ruby: $failed of 50 runs failed" | tee -a stress-logs/summary.txt
          grep -h "cannot remove\|EACCES\|Permission" stress-logs/ruby-*.log | sort | uniq -c | head -20 || true
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-lock-stress
          path: stress-logs
      - name: Fail when any run failed
        run: |
          cat stress-logs/summary.txt
          ! grep -v " 0 of 50 " stress-logs/summary.txt
