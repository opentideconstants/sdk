name: TEMPORARY Windows crashed-lock stress (remove before merge)

# Temporary: measures the Windows lock-release race before and after the fix.
# It runs the race test and the two-waiter test many times, with the SDK lock
# code from before the fix (50e239e) and with the current code, and uploads
# the logs. It publishes nothing and is removed before the branch is final.
on:
  push:
    branches: [sdk-parity]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  stress:
    name: TEMPORARY Windows lock stress
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with: { ruby-version: "3.3" }
      - name: Install the Python SDK
        run: python -m pip install -e 'python[tz]'
      - name: Stress, before and after the fix
        run: |
          mkdir -p stress-logs
          py_test() { python -m unittest discover -s python/tests -p test_unit.py -k "$1"; }
          rb_test() { ruby -Iruby/lib -Iruby/test ruby/test/test_cache_lock.rb -n "$1"; }
          loop() {  # label runs kind test
            failed=0
            for i in $(seq 1 "$2"); do
              if ! "$3" "$4" > "stress-logs/$1-$i.log" 2>&1; then failed=$((failed + 1)); fi
            done
            echo "$1: $failed of $2 runs failed" | tee -a stress-logs/summary.txt
          }
          for side in before after; do
            if [ "$side" = before ]; then
              git show 50e239e:python/src/opentideconstants/_cache.py > python/src/opentideconstants/_cache.py
              git show 50e239e:ruby/lib/opentideconstants/cache.rb > ruby/lib/opentideconstants/cache.rb
            else
              git checkout -- python/src/opentideconstants/_cache.py ruby/lib/opentideconstants/cache.rb
            fi
            loop "python-release-$side" 20 py_test test_release_removes_the_lock_while_a_waiter_reads_its_age
            loop "ruby-release-$side" 20 rb_test test_release_removes_the_lock_while_a_waiter_reads_its_age
            loop "python-two-waiters-$side" 50 py_test test_two_waiters_on_a_crashed_lock_never_hold_it_together
            loop "ruby-two-waiters-$side" 50 rb_test test_two_waiters_on_a_crashed_lock_never_hold_it_together
          done
          git diff --exit-code -- python/src ruby/lib
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-lock-stress
          path: stress-logs
      - name: Fail when any run after the fix failed
        run: |
          cat stress-logs/summary.txt
          ! grep -E "after: [1-9]" stress-logs/summary.txt
